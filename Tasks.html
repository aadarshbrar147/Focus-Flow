<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>FocusFlow For Task - Tasks </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="full-body">
    <!-- Topbar contain profile photo, searchbar and name -->
    
    <header class="topbar">
      <div class="profile">
        <img src="Assets/logo.jpg" alt="FocusFlow logo" class="logo"/>
        <h2 id="username">Welcome</h2>
      </div>
      <input placeholder="Search Tasks....." type="search" class="searchbar" id="searchTask"/>
    </header>
    
  <div class="main-body">
    <!-- main body contain sidebar and dashboard -->
  <aside class="sidebar">
    <nav>
      <a href="index.html" class="option">Dashboard</a>
      <a href="Tasks.html" class="option active">Tasks</a>
      <a href="Quote.html" class="option">Quotes</a>
      <a href="Feedback.html" class="option">Feedback</a>
    </nav>
  </aside>
  <!-- Tasks -->
  <main class="task-page">
    <div class="task-input-card">
      <h2>Add New Task</h2>
      <div class="task-input-group">
        <input placeholder="Type your Task ....." id="taskInput" type="text"/>
        <button id="addTaskBtn">
          Add Task
        </button>
      </div>
    </div>
    <div class="task-list-card">
      <h2>Your Tasks</h2>
      <div id="taskList">
      </div>
    </div>
  </main>
  </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
